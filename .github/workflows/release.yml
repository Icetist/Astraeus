name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # a trial: builds and signs, publishes nothing
    inputs:
      policy:
        description: SignPath signing policy
        default: test-signing

permissions:
  contents: write
  actions: read

env:
  # code signing through the SignPath Foundation; skipped until the secrets are set, and on tagged releases until the repo variable SIGN_RELEASES is true (the test certificate shouldn't ship)
  SIGNPATH_ORG: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
  SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
  SIGN: ${{ secrets.SIGNPATH_ORGANIZATION_ID != '' && (github.event_name == 'workflow_dispatch' || vars.SIGN_RELEASES == 'true') }}
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches version.h
        if: env.PUBLISH == 'true'
        shell: pwsh
        run: |
          $v = (Select-String -Path src/version.h -Pattern '#define APP_VER_STR "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { Write-Error "tag ${{ github.ref_name }} does not match version.h ($v)"; exit 1 }

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          mkdir build\obj || exit /b 1
          rc /nologo /fo build\obj\app.res res\app.rc || exit /b 1
          cl /nologo /std:c++20 /O2 /GL /Gw /guard:cf /EHsc /MT /W4 /permissive- /utf-8 /MP /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Fo:build\obj\ src\*.cpp build\obj\app.res /Fe:build\Astraeus.exe /link /LTCG /SUBSYSTEM:WINDOWS /OPT:REF /OPT:ICF /guard:cf /CETCOMPAT /DYNAMICBASE /NXCOMPAT /MANIFEST:NO user32.lib gdi32.lib shell32.lib shlwapi.lib ole32.lib oleaut32.lib advapi32.lib dwmapi.lib d2d1.lib d3d11.lib dxgi.lib dxguid.lib dwrite.lib dcomp.lib windowscodecs.lib pdh.lib iphlpapi.lib wlanapi.lib winhttp.lib bthprops.lib powrprof.lib wbemuuid.lib ntdll.lib windowsapp.lib || exit /b 1

      - name: Upload unsigned build
        id: unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Astraeus
          path: build/Astraeus.exe

      - name: Sign
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ env.SIGNPATH_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORG }}
          project-slug: astraeus
          signing-policy-slug: ${{ inputs.policy || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600 # release signing waits for the owner to approve it in SignPath
          output-artifact-directory: build/signed

      - name: Use the signed exe
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Copy-Item build/signed/Astraeus.exe build/Astraeus.exe -Force
          $sig = Get-AuthenticodeSignature build/Astraeus.exe
          Write-Output "::notice::signed by $($sig.SignerCertificate.Subject), status $($sig.Status)"

      - name: Keep the trial's signed exe
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Astraeus-trial
          path: build/Astraeus.exe

      - name: Hash
        shell: pwsh
        run: (Get-FileHash build/Astraeus.exe -Algorithm SHA256).Hash.ToLower() | Set-Content -NoNewline -Encoding ascii build/Astraeus.exe.sha256 # updater refuses exes that don't match

      - name: Clear files from an earlier run of this tag
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($f in 'Astraeus.exe', 'Astraeus.exe.sha256') { gh release delete-asset "${{ github.ref_name }}" $f --yes --repo "${{ github.repository }}" 2>$null } # republishing a version replaces its files
          exit 0

      - uses: softprops/action-gh-release@v2
        if: env.PUBLISH == 'true'
        with:
          files: |
            build/Astraeus.exe
            build/Astraeus.exe.sha256
          body_path: .github/release-notes.md # rewrite for each release

      - name: Earlier versions become pre-releases on a new major version
        if: env.PUBLISH == 'true' && endsWith(github.ref_name, '.0.0')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh release list --repo "${{ github.repository }}" --limit 200 --json tagName,isPrerelease | ConvertFrom-Json
          foreach ($r in $releases) {
            if ($r.tagName -ne "${{ github.ref_name }}" -and -not $r.isPrerelease) { gh release edit $r.tagName --prerelease --repo "${{ github.repository }}" }
          }

  winget:
    # opens a pull request on the winget package list for the new version; skipped until WINGET_TOKEN (a classic token with public_repo) is set in the repo secrets
    needs: build
    if: github.event_name == 'push'
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Send the new version to winget
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $base = "https://github.com/${{ github.repository }}/releases"
          $listing = Invoke-WebRequest https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/i/Icetist/Astraeus -Headers @{ Authorization = "Bearer $env:WINGET_TOKEN" } -SkipHttpErrorCheck
          if ($listing.StatusCode -eq 404) { Write-Output "::notice::$tag not sent to winget: the package is not listed yet"; exit 0 } # updates need a listed package; a first listing is its own pull request
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update Icetist.Astraeus --version $tag.TrimStart('v') --urls "$base/download/$tag/Astraeus.exe" --release-notes-url "$base/tag/$tag" --release-date (Get-Date -Format yyyy-MM-dd) --submit --no-open --token $env:WINGET_TOKEN
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
