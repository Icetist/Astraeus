name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

env:
  # code signing through the SignPath Foundation; the signing steps are skipped until these are set in the repo settings
  SIGNPATH_ORG: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
  SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches version.h
        shell: pwsh
        run: |
          $v = (Select-String -Path src/version.h -Pattern '#define APP_VER_STR "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { Write-Error "tag ${{ github.ref_name }} does not match version.h ($v)"; exit 1 }

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          mkdir build\obj || exit /b 1
          rc /nologo /fo build\obj\app.res res\app.rc || exit /b 1
          cl /nologo /std:c++20 /O2 /GL /Gw /guard:cf /EHsc /MT /W4 /permissive- /utf-8 /MP /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Fo:build\obj\ src\*.cpp build\obj\app.res /Fe:build\Astraeus.exe /link /LTCG /SUBSYSTEM:WINDOWS /OPT:REF /OPT:ICF /guard:cf /CETCOMPAT /DYNAMICBASE /NXCOMPAT /MANIFEST:NO user32.lib gdi32.lib shell32.lib shlwapi.lib ole32.lib oleaut32.lib advapi32.lib dwmapi.lib d2d1.lib d3d11.lib dxgi.lib dxguid.lib dwrite.lib dcomp.lib windowscodecs.lib pdh.lib iphlpapi.lib wlanapi.lib winhttp.lib bthprops.lib powrprof.lib wbemuuid.lib ntdll.lib windowsapp.lib || exit /b 1

      - name: Upload unsigned build
        id: unsigned
        if: env.SIGNPATH_ORG != ''
        uses: actions/upload-artifact@v4
        with:
          name: Astraeus
          path: build/Astraeus.exe

      - name: Sign
        if: env.SIGNPATH_ORG != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ env.SIGNPATH_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORG }}
          project-slug: astraeus
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signed

      - name: Use the signed exe
        if: env.SIGNPATH_ORG != ''
        shell: pwsh
        run: Copy-Item build/signed/Astraeus.exe build/Astraeus.exe -Force

      - name: Hash
        shell: pwsh
        run: (Get-FileHash build/Astraeus.exe -Algorithm SHA256).Hash.ToLower() | Set-Content -NoNewline -Encoding ascii build/Astraeus.exe.sha256 # updater refuses exes that don't match

      - name: Clear files from an earlier run of this tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($f in 'Astraeus.exe', 'Astraeus.exe.sha256') { gh release delete-asset "${{ github.ref_name }}" $f --yes --repo "${{ github.repository }}" 2>$null } # republishing a version replaces its files
          exit 0

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Astraeus.exe
            build/Astraeus.exe.sha256
          body_path: .github/release-notes.md # rewrite for each release

      - name: Earlier versions become pre-releases on a new major version
        if: endsWith(github.ref_name, '.0.0')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh release list --repo "${{ github.repository }}" --limit 200 --json tagName,isPrerelease | ConvertFrom-Json
          foreach ($r in $releases) {
            if ($r.tagName -ne "${{ github.ref_name }}" -and -not $r.isPrerelease) { gh release edit $r.tagName --prerelease --repo "${{ github.repository }}" }
          }
